[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-worklog-skill"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["jsonschema>=4.23,<5", "PyYAML>=6,<7", "Jinja2>=3.1,<4"]

[project.scripts]
worklog = "worklog.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

